plugins { id 'com.android.application' }
def edition = (project.findProperty('appEdition') ?: 'public').toString()
if (!(edition in ['public', 'personal'])) throw new GradleException('appEdition must be public or personal')
def updateOrigin = (project.findProperty('appUpdateOrigin') ?: (edition == 'public' ? 'https://app.gzsuy.vip' : '')).toString()
def updateChannel = (project.findProperty('appUpdateChannel') ?: '').toString()
def defaultServer = (project.findProperty('appDefaultServer') ?: '').toString()
def appId = edition == 'public' ? 'cn.qwenpaw.android.open' : 'cn.qwenpaw.android'
def appLabel = edition == 'public' ? 'QwenPaw 开源版' : 'QwenPaw'
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'cn.qwenpaw.android'
    compileSdk 35
    defaultConfig {
        applicationId appId
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('appVersionCode') ?: '24').toInteger()
        versionName = (project.findProperty('appVersionName') ?: '0.7.12')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'UPDATE_ORIGIN', quoted(updateOrigin)
        buildConfigField 'String', 'UPDATE_CHANNEL', quoted(updateChannel)
        buildConfigField 'String', 'DEFAULT_SERVER', quoted(defaultServer)
        resValue 'string', 'app_name', appLabel
        resValue 'string', 'app_package', appId
    }
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        delivery {
            if (System.getenv('QWENPAW_SIGN_STORE')) storeFile file(System.getenv('QWENPAW_SIGN_STORE'))
            storePassword System.getenv('QWENPAW_SIGN_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('QWENPAW_SIGN_ALIAS') ?: ''
            keyPassword System.getenv('QWENPAW_SIGN_KEY_PASSWORD') ?: ''
            enableV3Signing = true
        }
    }
    buildTypes {
        debug {
            if (System.getenv('QWENPAW_SIGN_STORE')) signingConfig signingConfigs.delivery
        }
        release {
            minifyEnabled false
            if (System.getenv('QWENPAW_SIGN_STORE')) signingConfig signingConfigs.delivery
        }
    }
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
